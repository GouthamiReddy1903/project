<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ATM Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>ATM Simulator</h2>

<button onclick="toggleDark()">Dark / Light Mode</button>

<h3>
Status :
<span id="status">Please Login</span>

&nbsp;&nbsp;

Balance :
₹ <span id="balance">5000</span>
</h3>

<div class="wrap">

<div class="atm">

<h3>Login</h3>

<input type="password" id="pin" placeholder="Enter 4 Digit PIN">

<br><br>

<button onclick="login()">Login</button>

<hr>

<h3>Transactions</h3>

<input type="number" id="amount" placeholder="Enter Amount">

<br><br>

<button onclick="deposit()">Deposit</button>

<button onclick="withdraw()">Withdraw</button>

<hr>

<h3>Mini Statement</h3>

<button onclick="showStatement()">View Statement</button>

<div id="statement"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
